[package]
# NOT `core` — that shadows Rust's built-in `core` crate and breaks any derive
# macro that expands to a `core::` path (thiserror, serde). Directory stays
# `core/` to match the architecture doc.
name = "essentio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-agnostic product logic for the AI workspace"

[lib]
name = "essentio_core"
path = "src/lib.rs"

[dependencies]
adk-agent = "1.0.0"
adk-core = "1.0.0"
adk-model = { version = "1.0.0", features = ["openai", "anthropic", "deepseek"] }
adk-runner = "1.0.0"
adk-session = "1.0.0"
async-trait.workspace = true
eventsource-stream = "0.2.3"
futures.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
